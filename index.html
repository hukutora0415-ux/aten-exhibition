<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>あ。展 ｜ 日常的絶望屋敷</title>
<meta name="description" content="展示は、来場者によって完成する。あなたが体験した「あ。」を投稿してください。" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="crt-flicker">

<div class="wrap">
  <header class="site-header">
    <a class="site-title" href="index.html">
      あ。展
      <small>日常的絶望屋敷</small>
    </a>
    <nav class="site-nav">
      <a href="diagnosis.html">あ。度診断</a>
      <a href="index.html" class="active">投稿する</a>
      <a href="gallery.html">ONLINE GALLERY</a>
    </nav>
  </header>

  <section class="hero fade-in">
    <div class="kicker">EXHIBITION IS COMPLETED BY VISITORS</div>
    <h1>展示は、<br />来場者によって完成する。</h1>
    <p class="lead">
      あなたが日常で見つけた、小さな「あ。」の瞬間を、
      タイトルと説明文にして投稿してください。
      そのまま一篇の展示作品として、オンライン展示室へ永続的に加わります。
    </p>
  </section>

  <!-- 診断結果バナー: diagnosis.html で診断済みの場合のみ script.js が表示 -->
  <div id="diagnosis-banner-slot"></div>

  <section class="submit-panel fade-in" id="submit-panel">
    <label for="title-input">展示タイトル</label>
    <input type="text" id="title-input" maxlength="40" placeholder="例：保存したつもり。" />

    <label for="desc-input" style="margin-top: var(--space-3);">説明文</label>
    <textarea id="desc-input" maxlength="200"
      placeholder="例：完成という安心感ほど、人を油断させるものはない。"></textarea>

    <label for="category-select" style="margin-top: var(--space-3);">カテゴリー</label>
    <select id="category-select">
      <option value="大学生活">大学生活</option>
      <option value="仕事">仕事</option>
      <option value="交通">交通</option>
      <option value="お金">お金</option>
      <option value="人間関係">人間関係</option>
      <option value="デジタル">デジタル</option>
      <option value="暮らし">暮らし</option>
      <option value="日常">日常</option>
      <option value="その他">その他</option>
    </select>

    <label for="tags-input" style="margin-top: var(--space-3);">タグ(カンマ区切り・任意)</label>
    <input type="text" id="tags-input" placeholder="例：レポート, 締切, 保存忘れ" />

    <div class="examples" style="margin-top: var(--space-2);">
      <span>・財布が無かった</span>
      <span>・終電を逃した</span>
      <span>・提出期限が昨日だった</span>
    </div>

    <button class="btn btn-primary" id="submit-btn">この「あ。」を展示する</button>
    <div class="form-status" id="form-status"></div>
  </section>

  <div id="result-slot"></div>

  <footer class="site-footer">
    「日常的絶望屋敷 ー あ。展 ー」 ｜ 投稿された体験は展示物として公開されます
  </footer>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
